# Experiment configuration. Override on the CLI: diagml train --config configs/default.yaml
seed: 42
test_size: 0.2
cv_folds: 5
scoring: roc_auc          # metric used for model selection
n_iter: 12                # random-search iterations per model
n_jobs: -1
decision_threshold: 0.5

artifacts_dir: artifacts

models:
  logistic_regression:
    params:
      clf__C: [0.01, 0.1, 1.0, 10.0, 100.0]
      clf__class_weight: [null, balanced]
  random_forest:
    params:
      clf__n_estimators: [200, 400]
      clf__max_depth: [null, 5, 10]
      clf__min_samples_leaf: [1, 2, 4]
  gradient_boosting:
    params:
      clf__n_estimators: [100, 200]
      clf__learning_rate: [0.03, 0.1]
      clf__max_depth: [2, 3]
      clf__subsample: [0.8, 1.0]
